<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Matrices Avanzada - Matemática Superior</title>
    
    <!-- Librería KaTeX para renderizado matemático profesional (LaTeX) -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script defer src="https://jsdelivr.net"></script>

    <style>
        :root {
            --primary: #4a148c; /* Morado Universitario Premium */
            --primary-light: #7c43bd;
            --dark: #111111; /* Negro Neutro */
            --gray-dark: #212121;
            --light: #f5f5f7; /* Blanco Tecnológico */
            --white: #ffffff;
            --accent: #d32f2f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light); 
            color: var(--dark);
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; 
            max-width: 1000px; 
            background: var(--white); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--light);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 { 
            color: var(--primary); 
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .subtitle { 
            color: #666; 
            font-size: 0.95rem; 
            margin-top: 5px;
        }

        /* Panel de Control */
        .control-panel { 
            background: var(--gray-dark); 
            color: var(--white);
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            display: flex; 
            flex-direction: column;
            gap: 15px; 
            align-items: center; 
        }

        .control-group { 
            display: flex; 
            flex-wrap: wrap;
            justify-content: center;
            align-items: center; 
            gap: 15px; 
        }

        label { font-weight: 500; font-size: 0.95rem; }
        
        select, input[type="file"] { 
            padding: 10px 16px; 
            border-radius: 8px; 
            border: 1px solid #ccc; 
            font-size: 14px; 
            background: var(--white); 
            color: var(--dark);
            outline: none;
        }

        /* Botones de acción */
        button { 
            background: var(--primary); 
            color: var(--white); 
            border: none; 
            padding: 12px 24px; 
            font-size: 15px; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-weight: 600;
            width: 100%;
            max-width: 220px;
            box-shadow: 0 4px 12px rgba(74, 20, 140, 0.2);
        }
        button:hover { background: var(--primary-light); transform: translateY(-1px); }
        button.secondary { background: transparent; border: 2px solid var(--white); color: var(--white); box-shadow: none; }
        button.secondary:hover { background: rgba(255,255,255,0.1); }
        
        /* Área de trabajo responsiva */
        .workspace { 
            display: flex; 
            flex-direction: column; 
            gap: 30px; 
            align-items: center; 
            margin-bottom: 35px;
        }

        .matrix-box { text-align: center; width: 100%; }
        .matrix-box h3 { margin-bottom: 15px; color: var(--gray-dark); font-size: 1.1rem; }
        
        /* Renderizado de rejilla física para inputs */
        .matrix-grid { 
            display: inline-flex; 
            flex-direction: column; 
            gap: 8px; 
            background: var(--gray-dark); 
            padding: 16px; 
            border-radius: 10px; 
        }
        
        .matrix-row { display: flex; gap: 8px; }
        
        .matrix-cell { 
            width: 55px; 
            height: 45px; 
            text-align: center; 
            font-size: 16px; 
            border: none; 
            border-radius: 6px; 
            outline: none; 
            background: var(--white);
            color: var(--dark);
            font-weight: 500;
        }

        /* Bloque de archivos */
        .photo-box { 
            width: 100%; 
            max-width: 340px;
            border: 2px dashed var(--primary); 
            border-radius: 12px; 
            padding: 20px; 
            text-align: center; 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        
        #preview { 
            max-width: 100%; 
            max-height: 150px; 
            margin-top: 15px; 
            border-radius: 6px; 
            display: none; 
            object-fit: contain; 
        }
        
        /* Resultados Científicos */
        .step-box { 
            margin-top: 25px; 
            padding: 25px; 
            background: var(--light); 
            border-left: 6px solid var(--primary); 
            border-radius: 8px; 
        }

        .step-box h2 { color: var(--primary); font-size: 1.3rem; margin-bottom: 15px; }
        .math-render { margin: 15px 0; padding: 15px; background: white; border-radius: 8px; overflow-x: auto; }
        .type-badge { display: inline-block; background: var(--dark); color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; margin-right: 5px; margin-bottom: 5px; }

        /* Media Queries (PC / Tablets) */
        @media (min-width: 700px) {
            body { padding: 5px 20px; }
            h1 { font-size: 2.4rem; }
            .control-panel { flex-direction: row; justify-content: space-between; }
            .workspace { flex-direction: row; justify-content: space-around; align-items: flex-start; }
            .matrix-box { width: auto; }
            button { width: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Software Analizador de Matrices</h1>
        <p class="subtitle">Proyecto de Investigación Académica • Curso: Matemática Superior</p>
    </header>
    
    <div class="control-panel">
        <div class="control-group">
            <label>Filas (m):</label>
            <select id="rows" onchange="crearMatrizDinamica()">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
            </select>
            
            <label>Columnas (n):</label>
            <select id="cols" onchange="crearMatrizDinamica()">
                <option value="2">2</option>
                <option value="3" selected>3</option>
                <option value="4">4</option>
            </select>
        </div>
        <button class="secondary" onclick="rellenarAleatorio()">Valores Aleatorios</button>
    </div>

    <div class="workspace">
        <div class="matrix-box">
            <h3>Matriz de Entrada \(A\)</h3>
            <div id="matrixContainer" class="matrix-grid"></div>
        </div>

        <div class="photo-box">
            <span style="font-weight: bold; color: var(--primary); margin-bottom: 10px; font-size: 0.9rem;">📷 Digitalización por Imagen</span>
            <input type="file" id="imageInput" accept="image/*" onchange="previsualizarImagen()" style="width: 100%;">
            <img id="preview" alt="Vista previa">
        </div>
    </div>

    <div style="text-align: center;">
        <button style="max-width: 400px; width: 100%; padding: 15px; font-size: 16px;" onclick="ejecutarAnalisisMatematico()">Ejecutar Análisis Estructural</button>
    </div>

    <div id="resultadoSeccion"></div>
</div>

<script>
// Generación dinámica de la interfaz de la matriz
function crearMatrizDinamica() {
    const rows = parseInt(document.getElementById('rows').value);
    const cols = parseInt(document.getElementById('cols').value);
    const container = document.getElementById('matrixContainer');
    container.innerHTML = '';

    for (let i = 0; i < rows; i++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'matrix-row';
        for (let j = 0; j < cols; j++) {
            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'matrix-cell';
            input.id = `cell-${i}-${j}`;
            input.value = 0;
            rowDiv.appendChild(input);
        }
        container.appendChild(rowDiv);
    }
}

function rellenarAleatorio() {
    const rows = parseInt(document.getElementById('rows').value);
    const cols = parseInt(document.getElementById('cols').value);
    for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
            document.getElementById(`cell-${i}-${j}`).value = Math.floor(Math.random() * 11) - 5;
        }
    }
}

function previsualizarImagen() {
    const file = document.getElementById('imageInput').files;
    const preview = document.getElementById('preview');
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            preview.src = e.target.result;
            preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
    }
}

// Algoritmos de Análisis Matemático Completo
function ejecutarAnalisisMatematico() {
    const rows = parseInt(document.getElementById('rows').value);
    const cols = parseInt(document.getElementById('cols').value);
    
    let A = [];
